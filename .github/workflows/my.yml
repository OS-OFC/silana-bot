name: Temporary VPS Access on Push

on:
  push: # تشغيل عند أي عملية دفع (push)
  workflow_dispatch: # تشغيل يدوي عند الحاجة

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      # استخدام أكشن GitHub لتسجيل الكود الحالي (checkout)
      - uses: actions/checkout@v4

      # تثبيت Tmate وفتح جلسة SSH
      - name: Setup Tmate and Start Session
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "=========================="
          echo "SSH Connection Details:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo "=========================="
          echo "Web Connection Details:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo "=========================="

      # إبقاء الجلسة حية
      - name: Keep Session Alive
        run: sleep infinity
